<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <meta name="description" content="">
    <meta name="author" content="Francisco Gandiola">
    <link rel="stylesheet" href="styles/place.css">
    <link rel="stylesheet" href="styles/place-large.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <script src="scripts/place.js" defer></script>
</head>
<body>
    <header>
        <h1>Argentina</h1>
    </header>
    <main>
        <div class="hero">
            <picture>
                <source srcset="images/capibara-hero-wide.webp" media="(min-width: 840px)">
                <img src="images/capibara-hero.webp" alt="capibara swimming in the river" width="480" height="720">
            </picture>
            <section id="info-card">
                <h2>Data</h2>
                <p><span class="highlight">Area: </span>2,780,400 km²</p>
                <p><span class="highlight">Population: </span>46,735,004</p>
                <p><span class="highlight">Capital: </span>Buenos Aires</p>
                <p><span class="highlight">National Language: </span>Spanish</p>
                <p><span class="highlight">Currency: </span>Peso Argentino ($, ARS)</p>
                <p><span class="highlight">Calling Code: </span>+54</p>
                <p><span class="highlight">Internet TLD: </span>.ar</p>
            </section>
            <section id="weather-card">
                <h2>Weather</h2>
                <img src="images/weather-mix.svg" alt="weather mix icon">
                <p id="temperature"></p>
                <p id="conditions"></p>
                <p id="wind"></p>
                <p id="wind-chill"></p>
            </section>
        </div>
    </main>
    <footer>
        <p>©<span id="currentYear"></span> ☀️ Francisco Gandiola ☀️ Argentina</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
