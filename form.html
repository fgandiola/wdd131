<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 | Product Review | Francisco Gandiola</title>
    <meta name="description" content="Page contains a form for reviewing five different products. Review includes rating, date of installation, preferred features and may include a written review.">
    <meta name="author" content="Francisco Gandiola">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form method="get" action="review.html">
            <div>
                <label for="product-list">Product name
                    <select id="product-list" name="product-list" required>
                        <option selected disabled value="">Select a Product</option>
                    </select>
                </label>
            </div>
            <div>Overall Rating
                <div id="form-rating">
                    <label for="star-1">★<input type="radio" id="star-1" name="rating" value="1" required></label>
                    <label for="star-2">★★<input type="radio" id="star-2" name="rating" value="2" required></label>
                    <label for="star-3">★★★<input type="radio" id="star-3" name="rating" value="3" required></label>
                    <label for="star-4">★★★★<input type="radio" id="star-4" name="rating" value="4" required></label>
                    <label for="star-5">★★★★★<input type="radio" id="star-5" name="rating" value="5" required></label>
                </div>                
            </div>
            <div>
                <label for="installation-date">Date of Installation
                    <input type="date" id="installation-date" name="installation-date" required>
                </label>
            </div>
            <div id="form-features">Which features did you find useful in the product?<br>
            (Check all that apply)
                <label for="durability"><input type="checkbox" id="durability" name="durability" value="yes">Durability</label>
                <label for="easy-use"><input type="checkbox" id="easy-use" name="easy-use" value="yes">Ease of Use</label>
                <label for="performance"><input type="checkbox" id="performance" name="performance" value="yes">Performance</label>
                <label for="design"><input type="checkbox" id="design" name="design" value="yes">Design</label>
            </div>
            <div>
                <label for="written-review">Written Review (Optional)
                    <textarea id="written-review" name="written-review"></textarea>
                </label>
            </div>
            <div>
                <label for="username">Your Name
                    <input type="text" id="username" name="username">
                </label>
            </div>
            <input type="submit" value="Post Review">
        </form>
    </main>
    <footer>
        <p>©<span id="currentYear"></span> 🧩 Francisco Gandiola 🧩 Argentina</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
