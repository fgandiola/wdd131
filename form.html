<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 | Product Review | Francisco Gandiola</title>
    <meta name="description" content="">
    <meta name="author" content="Francisco Gandiola">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form method="get" action="review.html">
            <div>
                <label>Product name
                    <select id="product" name="product" required>
                        <option selected disabled>Choose a Product</option>
                    </select>
                </label>
            </div>
            <div>
                <label for="rating">Overall Rating</label>
                <label>★<input type="radio" id="star-1" name="rating" value="1" required></label>
                <label>★★<input type="radio" id="star-2" name="rating" value="2" required></label>
                <label>★★★<input type="radio" id="star-2" name="rating" value="3" required></label>
                <label>★★★★<input type="radio" id="star-4" name="rating" value="4" required></label>
                <label>★★★★★<input type="radio" id="star-5" name="rating" value="5" required></label>
            </div>
            <div>
                <label>Date of Installation
                    <input type="date" id="installationDate" name="installationDate" required>
                </label>
            </div>
            <div>
                <label>Which features did you find useful in the product? (Check all that apply)</label>
                <label><input type="checkbox" id="durability" name="durability" value="yes">Durability</label>
                <label><input type="checkbox" id="use" name="use" value="yes">Ease of Use</label>
                <label><input type="checkbox" id="performance" name="performance" value="yes">Performance</label>
                <label><input type="checkbox" id="design" name="design" value="yes">Design</label>
            </div>
            <div>
                <label>Written Review (Optional)
                    <textarea id="written-review" name="written-review"></textarea>
                </label>
            </div>
            <div>
                <label>Your Name
                    <input type="text" id="username" name="username">
                </label>
            </div>
            <input type="submit" value="Post Review">
        </form>
    </main>
    <footer>
        <p>©<span id="currentYear"></span> 🧩 Francisco Gandiola 🧩 Argentina</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
