<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 | Home Page | Must-watch Argentine Films</title>
    <meta name="description" content="Main page for Must-watch Argentine Films. Site includes a filtered list of argentine movies. Movie cards include title, year, genre, director, cast and a brief description.">
    <meta name="author" content="Francisco Gandiola">
    <link rel="stylesheet" href="styles/site.css">
    <link rel="stylesheet" href="styles/home.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Arvo:ital,wght@0,400;0,700;1,400;1,700&family=Montserrat:ital@0;1&display=swap"
        rel="stylesheet">
    <script src="scripts/home.js" defer></script>
    <script src="scripts/review.js" defer></script>
</head>
<body>
    <header>
        <h1>Must-watch Argentine Films</h1>
        <p>“Art is a response to life. To be an artist is to embark on a risky way of living.”</p>
        <button type="button" id="movie-filter" aria-label="movie filter button"></button>
        <nav>
            <ul>
                <li><a href="#" id="all-filter">All Movies</a></li>
                <li><a href="#" id="comedy-filter">Comedy</a></li>
                <li><a href="#" id="crime-filter">Crime</a></li>
                <li><a href="#" id="drama-filter">Drama</a></li>
                <li><a href="#" id="fantasy-filter">Fantasy</a></li>
                <li><a href="#" id="scifi-filter">Sci-Fi</a></li>
                <li><a href="#" id="thriller-filter">Thriller</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="hero">
            <picture>
                <source srcset="images/hero-main-wide.webp" media="(min-width: 600px)">
                <img src="images/hero-main.webp" alt="argentine films banner" width="340" height="300" loading="lazy">
            </picture>
        </div>
        <section>
            <h2>Our Recommendations <span id="genre-heading"></span></h2>
            <div id="movie-list">
            </div>
        </section>
    </main>
    <footer>
        <p>©<span id="currentYear"></span> ■ Francisco Gandiola ■ Argentina</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
